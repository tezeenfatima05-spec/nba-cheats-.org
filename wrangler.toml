name = "nba-cheats-org"
compatibility_date = "2024-11-10"

# Static Astro output (`dist/`). Build with `npm run build` before deploy.
[assets]
directory = "./dist"
not_found_handling = "404-page"

[vars]
# Canonical origin for sitemap, robots, and HTML canonical/hreflang (must match live domain).
SITE = "https://nbacheats.org"
